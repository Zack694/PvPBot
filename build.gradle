plugins {
        id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
        // Loom adds the essential maven repositories automatically.
        maven { url = "https://maven.shedaniel.me/" } // Cloth Config (optional advanced-config UI)
}

dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
        // Optional: Cloth Config powers the /pvpbot config screen when installed.
        // Compile-only + suggested (NOT required at runtime) — the built-in screen
        // is used when Cloth Config is absent.
        modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:21.11.151"
}

processResources {
        def version = project.mod_version
        inputs.property "version", version

        filesMatching("fabric.mod.json") {
                expand "version": version
        }
}

tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        it.options.encoding = "UTF-8"
}

java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
}

jar {
        from("LICENSE")
}
