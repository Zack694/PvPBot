name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --console=plain

      - name: Verify jar contents
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          echo "jar: $JAR"
          unzip -l "$JAR" | grep -E "fabric.mod.json|assets/pvpbot/model/" 
          unzip -p "$JAR" fabric.mod.json | grep '"version"'

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: pvpbot-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  pretrain-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: pip install numpy
      - name: Simulator smoke test (v3)
        working-directory: pretrain/v3
        run: |
          python -m py_compile *.py
          python smoke_test.py
